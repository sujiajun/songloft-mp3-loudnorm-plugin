<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>响度归一化</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .song-list { display: flex; flex-direction: column; gap: 8px; }
    .song-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .status { margin-top: 20px; padding: 10px; border-radius: 6px; background: #f0f0f0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎵 响度归一化</h1>
  <div class="controls">
    <label>目标响度 (LUFS): <input type="number" id="targetLoudness" value="-16" step="0.5"></label>
    <button id="refreshBtn">刷新列表</button>
    <button id="normalizeBtn">处理选中</button>
  </div>
  <div id="songList" class="song-list">加载中...</div>
  <div id="status" class="status"></div>

  <script>
    const API_BASE = '/api/plugin/loudness';  // 确保和 entryPath 一致
    let songs = [];

    async function fetchSongs() {
      const res = await fetch(`${API_BASE}/songs`);
      songs = await res.json();
      renderSongs();
    }

    function renderSongs() {
      const container = document.getElementById('songList');
      container.innerHTML = songs.map(s => `
        <div class="song-item">
          <input type="checkbox" data-id="${s.id}">
          <span>${s.title} (${s.file_path})</span>
        </div>
      `).join('');
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchSongs);

    document.getElementById('normalizeBtn').addEventListener('click', async () => {
      const checked = document.querySelectorAll('#songList input:checked');
      const songIds = Array.from(checked).map(cb => cb.dataset.id);
      if (!songIds.length) return alert('请至少选择一首歌曲');

      const targetLoudness = parseFloat(document.getElementById('targetLoudness').value) || -16;
      const btn = document.getElementById('normalizeBtn');
      btn.disabled = true;

      const res = await fetch(`${API_BASE}/normalize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ songIds, targetLoudness })
      });
      const data = await res.json();

      document.getElementById('status').textContent = JSON.stringify(data.results, null, 2);
      btn.disabled = false;
      fetchSongs();
    });

    fetchSongs();
  </script>
</body>
</html>
