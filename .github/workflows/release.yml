name: 自动打包插件
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.jsplugin.zip
