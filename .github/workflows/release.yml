name: 自动打包插件
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: 打包完整插件
        run: |
          # 把 plugin.json 复制到 dist 目录
          cp plugin.json dist/
          # 进入 dist 目录打包所有文件
          cd dist
          zip -q -r ../songloft-loudness-normalizer-1.0.0.jsplugin.zip *
      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          files: songloft-loudness-normalizer-1.0.0.jsplugin.zip
